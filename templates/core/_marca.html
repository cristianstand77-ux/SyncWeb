{# Logo da SyncWeb. Use: {% include "core/_marca.html" with tamanho=40 href="#inicio" %} #}
<a href="{{ href|default:'/' }}" class="marca" aria-label="{{ rotulo|default:'SyncWeb Solutions, página inicial' }}">
  <svg width="{{ tamanho|default:40 }}" height="{{ tamanho|default:40 }}" viewBox="0 0 40 40" aria-hidden="true">
    {% if com_gradiente %}
      <defs>
        <linearGradient id="sw-logo" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3DE0B0" />
          <stop offset="1" stop-color="#087F68" />
        </linearGradient>
      </defs>
    {% endif %}
    <path d="M20 2.5 35.2 11.25v17.5L20 37.5 4.8 28.75v-17.5Z" fill="none" stroke="url(#sw-logo)" stroke-width="2.4" stroke-linejoin="round" />
    <path d="M26.5 14.2h-9.2a3 3 0 0 0 0 6h5.4a3 3 0 0 1 0 6h-9.2" fill="none" stroke="#00C58E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  <span>
    <span class="marca__nome">SYNCWEB</span>
    <span class="marca__sub">SOLUTIONS</span>
  </span>
</a>
